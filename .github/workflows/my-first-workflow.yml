name: my-first-workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  ENV_TYPE: dev
  APP_USER: cuzminv
  APP_PORT: 8080

jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: checkout
        uses: actions/checkout@v6.1.0
      - name: Step 2
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> ./artifacts/list.txt
          echo `hostname` >> ./artifacts/hostname.txt
      - name: Upload artifacts folder
        uses: actions/upload-artifact@v4.4.3
        with:
          name: myartifact
          path: ./artifacts/*
      - name: upload from multiple paths
        uses: actions/upload-artifact@v4.4.3
        with:
          name: multiple-paths
          path: |
            ./myartifact.txt 
            ./artifacts/*
      - name: upload from multiple paths with exclusions
        uses: actions/upload-artifact@v4.4.3
        with:
          name: multiple-paths-with-exclusions
          path: |
            ./myartifact.txt 
            ./artifacts/*
            !**/hostname.txt
      - name: referring env vars
        run: |
          echo $ENV_TYPE
          echo $APP_USER
          echo $APP_PORT
      - name: repository secrets
        run: |
          echo ${{ secrets.APP_PASS }}
  job2:
    name: Job2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: checking current directory
        run: pwd && ls -ltr
      - name: Download artifacts from job1
        uses: actions/download-artifact@v8
        with:
          name: myartifact
      - name: checking current directory post download
        run: pwd && ls -ltr
      - name: Successful completion of job2
        run: exit 0
  job3:
    name: Job3
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: creating custom folder for download
        run: mkdir -p ./custom-folder
      - name: checking current directory
        run: pwd && ls -ltr
      - name: Download artifacts from job1 inside custom folder
        uses: actions/download-artifact@v8
        with:
          name: myartifact
          path: ./custom-folder
      - name: checking current directory post download
        run: pwd && ls -ltr ./custom-folder
  job4:
    name: Job4
    runs-on: ubuntu-latest
    steps:
      - name: referring context or built-in env vars
        run: |
          echo "triggerd by event: ${{ github.event_name }}"
          echo "triggerd by workflow: ${{ github.workflow }}"
          echo "triggerd by action: ${{ github.action }}"
          echo "new changes pushed to branch: ${{ github.ref }}"
          echo "changes added by user: ${{ github.actor }} in ${{ github.head_ref }} branch"
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
      - name : Upload test results
        uses: actions/upload-artifact@v4.4.3
        with:
          name: unit-test-results
          path: reports/

  staging:
    name: Staging
    runs-on: ubuntu-latest
    environment:
      name: stg
    if: github.head_ref == 'dev'
    steps:
      - name: referring env vars and secrets
        run: |
          echo "running deployment on $ {{ vars.HOST }} using user $ {{ secrets.USER }}"
  production:
    name: Production
    runs-on: ubuntu-latest
    environment:
      name: prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: referring env vars and secrets
        run: |
          echo "running deployment on $ {{ vars.HOST }} using user $ {{ secrets.USER }}"
  
  codeql:
      name: CodeQL Analysis
      runs-on: ubuntu-latest
      permissions:
        actions: read  #lets the job read information about Actions itself, such as workflow runs and the workflow files. The comment in your snippet is a bit misleading, because the token doesn’t just open files. CodeQL’s action uses this permission to look up details about the current workflow run through the API, and it’s needed in private repos. It also lets CodeQL analyze the workflow files themselves, since it can scan GitHub Actions workflows for security issues.
        contents: read #lets the job check out your repository code.
        security-events: write #lets the job upload scan results to the repository’s Security tab (code scanning alerts).
         #Required for uploading SARIF file. What is the SARIF file?
        # SARIF is a standard format for the output of static analysis tools. It allows the results of different tools to be aggregated and viewed in a consistent way.
      strategy:
        matrix: #Required for CodeQL analysis. 
                #The matrix defines the different configurations that the job will run. 
                #In this case, the matrix is defined with a single language, Python.
          language: [ 'python' ]
        #A strategy matrix allows you to define multiple configurations for a job, and GitHub Actions will run the job for each configuration. In this case, the matrix is defined with a single language
        steps: 
          - name: Checkout repository
            uses: actions/checkout@v6.1.0
          - name: Initialize CodeQL
            uses: github/codeql-action/init@v3
            with:
              languages: ${{ matrix.language }}
          - name: Autobuild
            uses: github/codeql-action/autobuild@v3
          - name: Perform CodeQL Analysis
            uses: github/codeql-action/analyze@v3
            with:
              category: "/language:${{ matrix.language }}-security"