name: my-first-workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:  #Required for code scanning and secret scanning to work
  actions: read
  security-events: write
  packages: write
  contents: read

jobs:
  ci-pipeline-job:
    uses: VasileCuzmin/reusable-workflows/.github/workflows/ci-pipeline.yaml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
