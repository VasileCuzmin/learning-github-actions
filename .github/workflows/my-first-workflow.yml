name: my-first-workflow
on: 
  push:
    branches:
      - main
jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: | 
         pwd
         ls -ltr
         hostname
      - name: checkout
        uses: actions/checkout@v6.1.0
      - name: Step 2
        run: |
          echo `pwd` >> myartifact.txt
          ls -ltr
          hostname
      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: myartifact
          path: ./myartifact.txt
