name: self-hosted-runner-demo
on:
    push:
        branches:
            - dev
jobs:
    demo-1:
        runs-on: self-hosted
        steps:
            - name: Display system information
              run: |
                  echo "Operating System: $(uname -s)"
                  echo "Kernel Version: $(uname -r)"
                  echo "Runner name: $RUNNER_NAME"
                  echo "Runner OS: $RUNNER_OS"
